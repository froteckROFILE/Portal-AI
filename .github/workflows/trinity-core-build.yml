name: Build Trinity Core APK
on:
  workflow_dispatch:
  push:
    branches: [ trinity-core ]
    paths: ['trinity-core/android/**', '.github/workflows/trinity-core-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: trinity-core/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TRINITY-CORE-debug-apk
          path: trinity-core/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
